name: Impactly comment

# Posts the Impactly report of a PR as a comment on that PR (and updates it on new pushes).
#
# Why a separate workflow: a PR from a fork runs `pull_request` workflows with a read-only token,
# so the CI run cannot comment. `workflow_run` runs afterwards in this repository's context with a
# token that can. In exchange it must never run PR code:
# - The Action (`uses: ./`) comes from this repository's default branch, the default checkout for
#   workflow_run. Nothing is installed or built here.
# - The report artifact from the PR run is data only. The Action validates it, drops its free
#   text and writes the comment itself, and only accepts the PR number from the artifact if that
#   PR's head is the commit the CI run analysed (`workflow_run.head_sha`).
# Like all `workflow_run` workflows, this file takes effect from the default branch only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Post Impactly comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # download the report artifact of the CI run
      contents: read # check out the default branch
      pull-requests: write # create or update the comment
    steps:
      - name: Checkout default branch (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outside the workspace, so the untrusted artifact can never overlap the checked-out Action.
      - name: Download report
        continue-on-error: true # no artifact (e.g. a cancelled run): the next step says so and exits
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impactly-report
          path: ${{ runner.temp }}/impactly-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post comment
        uses: ./
        with:
          mode: comment
          report-dir: ${{ runner.temp }}/impactly-report
