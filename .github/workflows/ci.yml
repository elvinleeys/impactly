name: CI

# Runs automatically on every PR to main and every push to main.
# `pull_request` (not `pull_request_target`) gives fork PRs a read-only token and no secrets,
# so running the PR's own code here is safe.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is still in progress, so only the latest commit is verified.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the impact report below can find the merge-base.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Reuses downloaded packages between runs, keyed on package-lock.json.
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Dogfooding: analyse this PR with Impactly and hand the result to impactly-comment.yml, which posts
  # it as a PR comment. This job only reads (no secrets, read-only token), so it is safe for fork PRs;
  # the report it uploads is treated as untrusted by the comment workflow. It never blocks the PR,
  # and it runs separately from `verify` so a failing test does not stop the comment.
  report:
    name: Impactly report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the analysis can find the merge-base.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Analyse this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p impactly-report
          # Exit code 1 means a section failed; the JSON report is still written and explains it.
          node dist/entry/cli.js --base "$BASE_SHA" --head "$HEAD_SHA" > impactly-report/report.json || [ "$?" -eq 1 ]
          echo "$PR_NUMBER" > impactly-report/pr-number.txt
          # The same comment, also on the run's Summary page.
          node dist/entry/cli.js --base "$BASE_SHA" --head "$HEAD_SHA" --markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report for the comment workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impactly-report
          path: impactly-report/
          retention-days: 7
          if-no-files-found: error
